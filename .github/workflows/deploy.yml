name: Deploy to GitHub Pages

# This workflow uses NO third-party or GitHub-owned actions (`uses:`), only shell
# commands. It therefore works even when the repository's Actions policy only
# allows actions owned by the repository owner.
#
# The built site is pushed to the `gh-pages` branch. In Settings → Pages set
# "Source: Deploy from a branch", branch `gh-pages`, folder `/ (root)`.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.4'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      # Angular 21 requires Node.js ^20.19 || ^22.12 || >=24 (preinstalled on the runner)
      - name: Check Node.js version
        run: |
          node -e "const [M,m]=process.versions.node.split('.').map(Number);
            const ok=(M===20&&m>=19)||(M===22&&m>=12)||M>=24;
            console.log('Node', process.version); if(!ok){console.error('Unsupported Node version');process.exit(1)}"

      # The repository lockfile is bun.lock, so dependencies are installed with Bun
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test -- --watch=false

      - name: Build static site for GitHub Pages
        run: bun run build:gh-pages

      - name: Publish to gh-pages branch
        if: github.event_name != 'pull_request'
        working-directory: dist/app/browser
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          OWNER="${GITHUB_REPOSITORY%%/*}"
          echo "Published: https://${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" | tee -a "$GITHUB_STEP_SUMMARY"
